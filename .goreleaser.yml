version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: scripthold
    main: ./cmd/scripthold
    binary: scripthold
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Embed the fork version in both the command and server package.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/zoster81/scripthold/filetoolsserver.Version={{.Version}}

archives:
  - id: default
    ids:
      - scripthold
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: '{{ .CommitDate }}'
    files:
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: TOOLS.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: CHANGELOG.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: examples/start-openai-tunnel.ps1
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: examples/start-openai-tunnel-http-with-local-stdio.ps1
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: examples/start-stdio.ps1
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: examples/start-streamable-http.ps1
        info:
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Also publish raw binaries for MCP registry (GoReleaser adds .exe automatically for Windows)
  - id: binaries
    ids:
      - scripthold
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: zoster81
    name: scripthold

# MCP Registry publication is handled by publish-registry.yml after the release
# workflow verifies checksums and generates the release-specific server.json.
