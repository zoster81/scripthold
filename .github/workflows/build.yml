name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code go.mod go.sum

  build:
    needs: verify-modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: scripthold_linux_amd64
          - goos: linux
            goarch: arm64
            filename: scripthold_linux_arm64
          - goos: windows
            goarch: amd64
            filename: scripthold_windows_amd64.exe
          - goos: windows
            goarch: arm64
            filename: scripthold_windows_arm64.exe
          - goos: darwin
            goarch: amd64
            filename: scripthold_darwin_amd64
          - goos: darwin
            goarch: arm64
            filename: scripthold_darwin_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          OUTPUT: dist/${{ matrix.filename }}
        run: |
          mkdir -p dist
          version="ci-${GITHUB_SHA::12}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/scripthold/filetoolsserver.Version=${version}" \
            -o "${OUTPUT}" \
            ./cmd/scripthold

      - name: Upload target
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  container-smoke:
    needs: verify-modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build container image
        env:
          IMAGE: scripthold:ci
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}"
          docker build --build-arg VERSION="${version}" -t "${IMAGE}" .

      - name: Smoke-test container transports
        env:
          IMAGE: scripthold:ci
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}"

          uid="$(docker run --rm --entrypoint id "${IMAGE}" -u)"
          test "${uid}" = "10001"
          test "$(docker run --rm "${IMAGE}" --version)" = "${version}"

          export MCP_EXTERNAL_SMOKE_EXECUTABLE=docker
          export MCP_EXTERNAL_SMOKE_ARGS_JSON='["run","--rm","-i","--read-only","--cap-drop=ALL","--security-opt=no-new-privileges","--tmpfs","/tmp:rw,noexec,nosuid,size=64m","--mount","type=bind,source={TEMP_ROOT},target=/data","scripthold:ci","--transport=stdio","/data"]'
          export MCP_EXTERNAL_SMOKE_EXPECTED_VERSION="${version}"
          export MCP_EXTERNAL_SMOKE_EXPECTED_ROOT=/data
          go test ./cmd/scripthold -run '^TestExternalStdioBinarySmoke$' -count=1 -v

          workdir="$(mktemp -d)"
          container="scripthold-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            sudo rm -rf "${workdir}"
          }
          trap cleanup EXIT

          mkdir -p "${workdir}/data" "${workdir}/secrets"
          openssl rand -hex 32 > "${workdir}/secrets/token"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "${workdir}/secrets/key.pem" \
            -out "${workdir}/secrets/cert.pem" \
            >/dev/null 2>&1
          chmod 0755 "${workdir}"
          chmod 0600 "${workdir}/secrets/token" "${workdir}/secrets/key.pem"
          chmod 0644 "${workdir}/secrets/cert.pem"
          sudo chown -R 10001:10001 "${workdir}/data" "${workdir}/secrets"

          docker run -d --name "${container}" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=${workdir}/data,target=/data" \
            --mount "type=bind,source=${workdir}/secrets,target=/run/secrets,readonly" \
            --publish 127.0.0.1:18765:8765 \
            --env MCP_HTTP_TOKEN_FILE=/run/secrets/token \
            --env MCP_HTTP_ADDR=0.0.0.0:8765 \
            --env MCP_HTTP_ALLOW_NON_LOOPBACK=1 \
            --env MCP_HTTP_TLS_CERT_FILE=/run/secrets/cert.pem \
            --env MCP_HTTP_TLS_KEY_FILE=/run/secrets/key.pem \
            --env MCP_HTTP_ALLOWED_HOSTS=127.0.0.1:18765 \
            "${IMAGE}" --transport=streamable-http /data

          ready=0
          for _ in $(seq 1 50); do
            if curl --silent --show-error --fail --insecure \
              https://127.0.0.1:18765/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "${ready}" != "1" ]]; then
            docker logs "${container}"
            exit 1
          fi

          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            https://127.0.0.1:18765/mcp)" = "401"
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --header 'Origin: https://attacker.example' \
            https://127.0.0.1:18765/healthz)" = "403"
          token="$(sudo cat "${workdir}/secrets/token")"
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --header "Authorization: Bearer ${token}" \
            https://127.0.0.1:18765/mcp)" = "405"
          if curl --silent --insecure --include \
            --header 'Origin: https://attacker.example' \
            https://127.0.0.1:18765/healthz 2>/dev/null \
            | grep -qi '^Access-Control-Allow-Origin:'; then
            echo 'unexpected CORS allow header' >&2
            exit 1
          fi

          docker stop --time 20 "${container}" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "${container}")" = "0"
