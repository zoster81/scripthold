      - name: Collect numeric artifact IDs
        id: collect
        shell: bash
        env:
          A1: ${{ steps.a1.outputs.artifact-id }}
          A2: ${{ steps.a2.outputs.artifact-id }}
          A3: ${{ steps.a3.outputs.artifact-id }}
          A4: ${{ steps.a4.outputs.artifact-id }}
          A5: ${{ steps.a5.outputs.artifact-id }}
          A6: ${{ steps.a6.outputs.artifact-id }}
          A7: ${{ steps.a7.outputs.artifact-id }}
          D1: ${{ steps.a1.outputs.artifact-digest }}
          D2: ${{ steps.a2.outputs.artifact-digest }}
          D3: ${{ steps.a3.outputs.artifact-digest }}
          D4: ${{ steps.a4.outputs.artifact-digest }}
          D5: ${{ steps.a5.outputs.artifact-digest }}
          D6: ${{ steps.a6.outputs.artifact-digest }}
          D7: ${{ steps.a7.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ids=()
          digests=()
          for i in $(seq 1 7); do
            id_var="A${i}"
            digest_var="D${i}"
            id="${!id_var}"
            digest="${!digest_var}"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            number="$(printf '%02d' "$i")"
            extension=dat
            file="fixtures/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-package-${number}.${extension}"
            actual="$(sha256sum "$file")"
            [[ "${actual%% *}" == "$digest" ]] || exit 1
            ids+=("$id")
            digests+=("$digest")
          done
          {
            (IFS=,; echo "ids=${ids[*]}")
            (IFS=,; echo "digests=${digests[*]}")
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
  consumer:
    needs: [normal, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Allocate private destination
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/raw-probe"
      - name: Raw-download exactly 22 IDs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.normal.outputs.ids }},${{ needs.package.outputs.ids }}
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/raw-probe
      - name: Verify complete inventory and bytes
        shell: bash
        env:
          NORMAL_IDS: ${{ needs.normal.outputs.ids }}
          PACKAGE_IDS: ${{ needs.package.outputs.ids }}
          NORMAL_DIGESTS: ${{ needs.normal.outputs.digests }}
          PACKAGE_DIGESTS: ${{ needs.package.outputs.digests }}
          NORMAL_RESULT: ${{ needs.normal.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          NORMAL_ATTEMPT: ${{ needs.normal.outputs.attempt }}
          PACKAGE_ATTEMPT: ${{ needs.package.outputs.attempt }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.join(process.env.RUNNER_TEMP, 'raw-probe');
          const normalIds = process.env.NORMAL_IDS.split(',');
          const packageIds = process.env.PACKAGE_IDS.split(',');
          const ids = [...normalIds, ...packageIds];
          if (normalIds.length !== 15 || packageIds.length !== 7 ||
              new Set(ids).size !== 22 ||
              ids.some(id => !/^[1-9][0-9]*$/.test(id) ||
                !Number.isSafeInteger(Number(id)))) throw Error('invalid IDs');
          const dir = fs.lstatSync(root);
          if (!dir.isDirectory() || dir.isSymbolicLink() || (dir.mode & 0o077))
            throw Error('unsafe destination');
          const attempts = new Map([
            ['normal', process.env.NORMAL_ATTEMPT],
            ['package', process.env.PACKAGE_ATTEMPT],
          ]);
          const currentAttempt = process.env.GITHUB_RUN_ATTEMPT;
          if (!/^[1-9][0-9]*$/.test(currentAttempt) ||
              !Number.isSafeInteger(Number(currentAttempt))) throw Error('invalid run attempt');
          for (const attempt of attempts.values()) {
            if (!/^[1-9][0-9]*$/.test(attempt) ||
                !Number.isSafeInteger(Number(attempt)) || Number(attempt) > Number(currentAttempt))
              throw Error('invalid producer attempt');
          }
          if (process.env.NORMAL_RESULT !== 'success' ||
              process.env.PACKAGE_RESULT !== 'success') throw Error('untrusted producer result');
          const digests = new Map();
          for (const [group, count] of [['normal', 15], ['package', 7]]) {
            const raw = process.env[group.toUpperCase() + '_DIGESTS'];
            const values = typeof raw === 'string' ? raw.split(',') : [];
            if (values.length !== count ||
                values.some(digest => !/^[0-9a-f]{64}$/.test(digest)))
              throw Error('invalid producer digests');
            digests.set(group, values);
          }
          const expected = [];
          for (const [group, count] of [['normal', 15], ['package', 7]]) {
            for (let i = 1; i <= count; i++) {
              const number = String(i).padStart(2, '0');
              const extension = group === 'normal' && i === 12 ? 'zip' : 'dat';
              const name = `probe-${process.env.GITHUB_RUN_ID}-${attempts.get(group)}-${group}-${number}.${extension}`;
              expected.push(name);
              const entry = fs.lstatSync(path.join(root, name));
              if (!entry.isFile() || entry.nlink !== 1) throw Error('unsafe file');
              const bytes = fs.readFileSync(path.join(root, name));
              const actualDigest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (actualDigest !== digests.get(group)[i - 1])
                throw Error('artifact digest mismatch');
              const original = group === 'normal' && i === 12
                ? Buffer.from('504b0506000000000000000000000000000000000000', 'hex')
                : Buffer.from(`raw-probe:${group}:${number}\n`);
              if (!bytes.equals(original)) throw Error('changed original bytes');
            }
          }
          if (JSON.stringify(fs.readdirSync(root).sort()) !== JSON.stringify(expected.sort()))
            throw Error('unexpected or missing physical files');
          console.log('22/22 exact synthetic raw transfers verified');
          NODE
      - name: Checkout isolated Go test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for the native private stage
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify native private handoff of the 15 transferred originals
        shell: bash
        env:
          RAW_NORMAL_PROBE: '1'
          NORMAL_ATTEMPT: ${{ needs.normal.outputs.attempt }}
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_TEMP"
          export GOTMPDIR="$RUNNER_TEMP"
          go test ./internal/releasearchive -run '^TestCITransferredNormalHandoff$' -count=1 -v
