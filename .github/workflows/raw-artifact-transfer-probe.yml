# Synthetic non-release cross-job raw artifact transport proof.
name: Raw artifact transfer probe
on:
  pull_request:
    paths:
      - '.github/workflows/raw-artifact-transfer-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normal:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.collect.outputs.ids }}
      digests: ${{ steps.collect.outputs.digests }}
      attempt: ${{ steps.collect.outputs.attempt }}
    steps:
      - name: Generate synthetic bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 fixtures
          for i in $(seq 1 15); do
            number="$(printf '%02d' "$i")"
            if [[ "$i" -eq 12 ]]; then
              # A valid, empty ZIP (22 bytes), not a package or release asset.
              printf '%s' 'UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA==' | base64 --decode > "fixtures/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-normal-${number}.zip"
            else
              printf 'raw-probe:normal:%02d\n' "$i" > "fixtures/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-normal-${number}.dat"
            fi
          done
      - name: Upload synthetic normal 01
        id: a1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-01.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 02
        id: a2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-02.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 03
        id: a3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-03.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 04
        id: a4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-04.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 05
        id: a5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-05.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 06
        id: a6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-06.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 07
        id: a7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-07.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 08
        id: a8
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-08.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 09
        id: a9
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-09.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 10
        id: a10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-10.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 11
        id: a11
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-11.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 12
        id: a12
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-12.zip
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 13
        id: a13
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-13.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 14
        id: a14
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-14.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic normal 15
        id: a15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-normal-15.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Collect numeric artifact IDs
        id: collect
        shell: bash
        env:
          A1: ${{ steps.a1.outputs.artifact-id }}
          A2: ${{ steps.a2.outputs.artifact-id }}
          A3: ${{ steps.a3.outputs.artifact-id }}
          A4: ${{ steps.a4.outputs.artifact-id }}
          A5: ${{ steps.a5.outputs.artifact-id }}
          A6: ${{ steps.a6.outputs.artifact-id }}
          A7: ${{ steps.a7.outputs.artifact-id }}
          A8: ${{ steps.a8.outputs.artifact-id }}
          A9: ${{ steps.a9.outputs.artifact-id }}
          A10: ${{ steps.a10.outputs.artifact-id }}
          A11: ${{ steps.a11.outputs.artifact-id }}
          A12: ${{ steps.a12.outputs.artifact-id }}
          A13: ${{ steps.a13.outputs.artifact-id }}
          A14: ${{ steps.a14.outputs.artifact-id }}
          A15: ${{ steps.a15.outputs.artifact-id }}
          D1: ${{ steps.a1.outputs.artifact-digest }}
          D2: ${{ steps.a2.outputs.artifact-digest }}
          D3: ${{ steps.a3.outputs.artifact-digest }}
          D4: ${{ steps.a4.outputs.artifact-digest }}
          D5: ${{ steps.a5.outputs.artifact-digest }}
          D6: ${{ steps.a6.outputs.artifact-digest }}
          D7: ${{ steps.a7.outputs.artifact-digest }}
          D8: ${{ steps.a8.outputs.artifact-digest }}
          D9: ${{ steps.a9.outputs.artifact-digest }}
          D10: ${{ steps.a10.outputs.artifact-digest }}
          D11: ${{ steps.a11.outputs.artifact-digest }}
          D12: ${{ steps.a12.outputs.artifact-digest }}
          D13: ${{ steps.a13.outputs.artifact-digest }}
          D14: ${{ steps.a14.outputs.artifact-digest }}
          D15: ${{ steps.a15.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ids=()
          digests=()
          for i in $(seq 1 15); do
            id_var="A${i}"
            digest_var="D${i}"
            id="${!id_var}"
            digest="${!digest_var}"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            number="$(printf '%02d' "$i")"
            extension=dat
            if [[ "$i" -eq 12 ]]; then extension=zip; fi
            file="fixtures/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-normal-${number}.${extension}"
            actual="$(sha256sum "$file")"
            [[ "${actual%% *}" == "$digest" ]] || exit 1
            ids+=("$id")
            digests+=("$digest")
          done
          {
            (IFS=,; echo "ids=${ids[*]}")
            (IFS=,; echo "digests=${digests[*]}")
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.collect.outputs.ids }}
      digests: ${{ steps.collect.outputs.digests }}
      attempt: ${{ steps.collect.outputs.attempt }}
    steps:
      - name: Generate synthetic bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 fixtures
          for i in $(seq 1 7); do
            printf 'raw-probe:package:%02d\n' "$i" > "fixtures/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-package-$(printf '%02d' "$i").dat"
          done
      - name: Upload synthetic package 01
        id: a1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-package-01.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic package 02
        id: a2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-package-02.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic package 03
        id: a3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-package-03.dat
