      - name: Upload synthetic package 07
        id: a7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-package-07.dat
