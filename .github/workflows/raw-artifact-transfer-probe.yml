      - name: Upload synthetic package 05
        id: a5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-package-05.dat
          archive: false
          if-no-files-found: error
          overwrite: false
      - name: Upload synthetic package 06
        id: a6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: fixtures/probe-${{ github.run_id }}-${{ github.run_attempt }}-package-06.dat
