name: Publish fork MCP Registry metadata

on:
  workflow_call:
    inputs:
      version:
        description: 'Fork release tag to publish'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork release tag to publish (for example, v2.1.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'zoster81/scripthold'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION_TAG: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Verify checked-out release tag and metadata
        run: |
          set -euo pipefail
          node scripts/verify-release-version.js "${VERSION_TAG}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"

      - name: Download and verify fork release assets
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/checksums.txt" \
            -o checksums.txt
          cat checksums.txt

          artifacts=(
            scripthold_darwin_amd64
            scripthold_darwin_amd64.tar.gz
            scripthold_darwin_arm64
            scripthold_darwin_arm64.tar.gz
            scripthold_linux_amd64
            scripthold_linux_amd64.tar.gz
            scripthold_linux_arm64
            scripthold_linux_arm64.tar.gz
            scripthold_windows_amd64.exe
            scripthold_windows_amd64.zip
            scripthold_windows_arm64.exe
            scripthold_windows_arm64.zip
          )
          expected_artifacts="$(printf '%s\n' "${artifacts[@]}" | LC_ALL=C sort)"
          actual_artifacts="$(awk '{ name=$2; sub(/^\*/, "", name); print name }' checksums.txt | LC_ALL=C sort)"
          if [[ "${actual_artifacts}" != "${expected_artifacts}" ]]; then
            echo 'release checksum manifest does not contain the exact expected 12 assets' >&2
            diff -u \
              <(printf '%s\n' "${expected_artifacts}") \
              <(printf '%s\n' "${actual_artifacts}") || true
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            curl -fSL --retry 3 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/${artifact}" \
              -o "${artifact}"
          done
          sha256sum --check checksums.txt

      - name: Generate verified fork registry manifest
        run: |
          set -euo pipefail
          node scripts/generate-server-json.js "${VERSION_TAG}" checksums.txt server.json
          cat server.json

      - name: Download verified mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            -o "${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_LINUX_AMD64_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          chmod +x mcp-publisher

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
