name: Publish fork MCP Registry metadata

on:
  workflow_call:
    inputs:
      version:
        description: 'Fork release tag to publish'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork release tag to publish (for example, v2.1.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'zoster81/scripthold' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION_TAG: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      MCPB_VERSION: 2.1.2
      MCPB_NPM_INTEGRITY: sha512-goRbBC8ySo7SWb7tRzr+tL6FxDc4JPTRCdgfD2omba7freofvjq5rom1lBnYHZHo6Mizs1jAHJeN53aZbDoy8A==
    steps:
      - name: Checkout Registry workflow source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: publication-source

      - name: Checkout immutable release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          path: release-source

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Verify checked-out release tag and metadata
        run: |
          set -euo pipefail
          cd release-source
          node scripts/verify-release-version.js "${VERSION_TAG}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"

      - name: Download and verify MCPB release assets
        run: |
          set -euo pipefail
          mkdir mcpb-assets
          cd mcpb-assets
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/mcpb-checksums.txt" \
            -o mcpb-checksums.txt
          bundles=(
            scripthold_darwin_amd64.mcpb
            scripthold_darwin_arm64.mcpb
            scripthold_linux_amd64.mcpb
            scripthold_linux_arm64.mcpb
            scripthold_windows_amd64.mcpb
            scripthold_windows_arm64.mcpb
          )
          expected="$(printf '%s\n' "${bundles[@]}" | LC_ALL=C sort)"
          actual="$(awk '{ name=$2; sub(/^\*/, "", name); print name }' mcpb-checksums.txt | LC_ALL=C sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo 'MCPB checksum manifest does not contain the exact expected six bundles' >&2
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            curl -fSL --retry 3 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/${bundle}" \
              -o "${bundle}"
          done
          sha256sum --check mcpb-checksums.txt

      - name: Verify published MCPB bundles
        run: |
          set -euo pipefail
          actual_integrity="$(npm view "@anthropic-ai/mcpb@${MCPB_VERSION}" dist.integrity)"
          test "${actual_integrity}" = "${MCPB_NPM_INTEGRITY}"
          for bundle in mcpb-assets/*.mcpb; do
            npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" info "${bundle}" >/dev/null
          done

      - name: Generate verified fork registry manifest
        run: |
          set -euo pipefail
          node publication-source/scripts/generate-server-json.js \
            "${VERSION_TAG}" \
            mcpb-assets/mcpb-checksums.txt \
            server.json \
            release-source
          cat server.json

      - name: Download verified mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            -o "${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_LINUX_AMD64_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          chmod +x mcp-publisher

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
