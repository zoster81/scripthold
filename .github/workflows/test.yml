name: Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Select evidence tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      reason: ${{ steps.classify.outputs.reason }}
      race_matrix: ${{ steps.classify.outputs.race_matrix }}
      platform_matrix: ${{ steps.classify.outputs.platform_matrix }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Select fail-closed evidence tier
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          force_full() {
            {
              printf '%s\n' 'tier=full'
              printf '%s\n' 'reason=non-PR, bootstrap, or untrusted policy change requires full qualification'
              printf '%s\n' 'race_matrix=[{"os":"ubuntu-latest","scope":"full"},{"os":"windows-latest","scope":"full"},{"os":"macos-latest","scope":"full"}]'
              printf '%s\n' 'platform_matrix=[{"os":"windows-latest","platform":"windows","scope":"full"},{"os":"macos-latest","platform":"darwin","scope":"full"}]'
            } >> "${GITHUB_OUTPUT}"
          }

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            force_full
            exit 0
          fi

          if [[ ! "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            force_full
            exit 0
          fi

          policy_script="${RUNNER_TEMP}/test-ci-policy.js"
          if ! git cat-file -e "${BASE_SHA}:scripts/test-ci-policy.js" 2>/dev/null; then
            force_full
            exit 0
          fi
          git show "${BASE_SHA}:scripts/test-ci-policy.js" > "${policy_script}"
          GITHUB_EVENT_NAME=pull_request node "${policy_script}" classify

  policy:
    name: Policy and documentation
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Verify repository identity and catalog
        run: go test ./internal/projectidentity ./internal/toolcatalog -count=1

      - name: Verify test architecture
        run: go test ./testarchitecture -count=1

      - name: Verify generated capability documentation
        run: go test ./internal/sourceintelligence -run '^TestCapabilityMatrixDocumentationMatchesRegistry$' -count=1

      - name: Test evidence-tier and Markdown-link policy
        run: node --test scripts/check-markdown-links.test.js scripts/test-ci-policy.test.js

      - name: Test release and fuzz orchestration scripts
        run: node --test scripts/generate-server-json.test.js scripts/prepare-mcpb-assets.test.js scripts/release-candidate-provenance.test.js scripts/run-fuzz.test.js scripts/verify-release-version.test.js

      - name: Validate local Markdown links
        run: node scripts/check-markdown-links.js

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history and candidate tree
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  verify-modules:
    name: Verify modules
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod tidy -diff
          go mod verify

  linux-regression:
    name: Linux regression
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run normal regression suite
        run: go test ./... -count=1

  platform-tests:
    name: Platform tests (${{ matrix.os }}, ${{ matrix.scope }})
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.platform_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run full platform regression
        if: matrix.scope == 'full'
        run: go test ./... -count=1

      - name: Run mapped platform regression
        if: matrix.scope == 'targeted'
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: node scripts/test-ci-policy.js run-targeted --failure-class platform --platform "${TARGET_PLATFORM}"

  race:
    name: Race (${{ matrix.os }}, ${{ matrix.scope }})
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.race_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run full race suite
        if: matrix.scope == 'full'
        run: go test -race ./... -count=1

      - name: Run mapped race suite
        if: matrix.scope == 'targeted'
        run: node scripts/test-ci-policy.js run-targeted --failure-class race --platform linux --race

  static-analysis:
    name: Static and vulnerability analysis
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Lint GitHub Actions workflows
        if: needs.classify.outputs.tier == 'full'
        run: bash scripts/validate-workflows.sh

  fuzz:
    name: Deterministic fuzz smoke
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Run risk-based fuzz smoke
        run: node scripts/run-fuzz.js --profile smoke

  native-smoke:
    name: Native binary smoke (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and smoke-test native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${PWD}/scripthold-smoke"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          version="ci-${GITHUB_SHA::12}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/scripthold/filetoolsserver.Version=${version}" \
            -o "${binary}" \
            ./cmd/scripthold
          export MCP_EXTERNAL_SMOKE_EXECUTABLE="${binary}"
          export MCP_EXTERNAL_SMOKE_ARGS_JSON='["--transport=stdio","{TEMP_ROOT}"]'
          export MCP_EXTERNAL_SMOKE_EXPECTED_VERSION="${version}"
          export MCP_EXTERNAL_SMOKE_EXPECTED_ROOT='{TEMP_ROOT}'
          go test ./cmd/scripthold -run '^TestExternal(StdioBinarySmoke|DurableTaskLifecycle|TaskSupervisorRecovery)$' -count=1 -v

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: scripthold_linux_amd64
          - goos: linux
            goarch: arm64
            filename: scripthold_linux_arm64
          - goos: windows
            goarch: amd64
            filename: scripthold_windows_amd64.exe
          - goos: windows
            goarch: arm64
            filename: scripthold_windows_arm64.exe
          - goos: darwin
            goarch: amd64
            filename: scripthold_darwin_amd64
          - goos: darwin
            goarch: arm64
            filename: scripthold_darwin_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          OUTPUT: dist/${{ matrix.filename }}
        run: |
          mkdir -p dist
          version="ci-${GITHUB_SHA::12}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/scripthold/filetoolsserver.Version=${version}" \
            -o "${OUTPUT}" \
            ./cmd/scripthold

  container-smoke:
    name: Container smoke
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build container image
        env:
          IMAGE: scripthold:ci
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}"
          docker build --build-arg VERSION="${version}" -t "${IMAGE}" .

      - name: Smoke-test container transports
        env:
          IMAGE: scripthold:ci
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}"

          uid="$(docker run --rm --entrypoint id "${IMAGE}" -u)"
          test "${uid}" = "10001"
          test "$(docker run --rm "${IMAGE}" --version)" = "${version}"

          export MCP_EXTERNAL_SMOKE_EXECUTABLE=docker
          export MCP_EXTERNAL_SMOKE_ARGS_JSON='["run","--rm","-i","--read-only","--cap-drop=ALL","--security-opt=no-new-privileges","--tmpfs","/tmp:rw,noexec,nosuid,size=64m","--mount","type=bind,source={TEMP_ROOT},target=/data","scripthold:ci","--transport=stdio","/data"]'
          export MCP_EXTERNAL_SMOKE_EXPECTED_VERSION="${version}"
          export MCP_EXTERNAL_SMOKE_EXPECTED_ROOT=/data
          go test ./cmd/scripthold -run '^TestExternalStdioBinarySmoke$' -count=1 -v

          workdir="$(mktemp -d)"
          container="scripthold-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            sudo rm -rf "${workdir}"
          }
          trap cleanup EXIT

          mkdir -p "${workdir}/data" "${workdir}/secrets"
          openssl rand -hex 32 > "${workdir}/secrets/token"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "${workdir}/secrets/key.pem" \
            -out "${workdir}/secrets/cert.pem" \
            >/dev/null 2>&1
          chmod 0755 "${workdir}"
          chmod 0600 "${workdir}/secrets/token" "${workdir}/secrets/key.pem"
          chmod 0644 "${workdir}/secrets/cert.pem"
          sudo chown -R 10001:10001 "${workdir}/data" "${workdir}/secrets"

          docker run -d --name "${container}" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=${workdir}/data,target=/data" \
            --mount "type=bind,source=${workdir}/secrets,target=/run/secrets,readonly" \
            --publish 127.0.0.1:18765:8765 \
            --env MCP_HTTP_TOKEN_FILE=/run/secrets/token \
            --env MCP_HTTP_ADDR=0.0.0.0:8765 \
            --env MCP_HTTP_ALLOW_NON_LOOPBACK=1 \
            --env MCP_HTTP_TLS_CERT_FILE=/run/secrets/cert.pem \
            --env MCP_HTTP_TLS_KEY_FILE=/run/secrets/key.pem \
            --env MCP_HTTP_ALLOWED_HOSTS=127.0.0.1:18765 \
            "${IMAGE}" --transport=streamable-http /data

          ready=0
          for _ in $(seq 1 50); do
            if curl --silent --show-error --fail --insecure \
              https://127.0.0.1:18765/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "${ready}" != "1" ]]; then
            docker logs "${container}"
            exit 1
          fi

          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            https://127.0.0.1:18765/mcp)" = "401"
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --header 'Origin: https://attacker.example' \
            https://127.0.0.1:18765/healthz)" = "403"
          token="$(sudo cat "${workdir}/secrets/token")"
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --header "Authorization: Bearer ${token}" \
            https://127.0.0.1:18765/mcp)" = "405"
          if curl --silent --insecure --include \
            --header 'Origin: https://attacker.example' \
            https://127.0.0.1:18765/healthz 2>/dev/null \
            | grep -qi '^Access-Control-Allow-Origin:'; then
            echo 'unexpected CORS allow header' >&2
            exit 1
          fi

          docker stop --time 20 "${container}" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "${container}")" = "0"

  release-config:
    name: Release configuration
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: check

  release-candidate:
    name: Release candidate
    if: ${{ always() }}
    needs:
      - classify
      - policy
      - gitleaks
      - verify-modules
      - linux-regression
      - platform-tests
      - race
      - static-analysis
      - fuzz
      - native-smoke
      - cross-build
      - container-smoke
      - release-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Attest required evidence for exact commit
        env:
          CI_EVIDENCE_TIER: ${{ needs.classify.outputs.tier }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/test-ci-policy.js verify

      - name: Record exact commit gate
        run: echo "Release candidate verified for ${GITHUB_SHA}"
