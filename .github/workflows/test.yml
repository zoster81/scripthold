name: Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-modules:
    name: Verify modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod tidy -diff
          go mod verify

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests with race detector
        run: go test -race ./... -count=1

      - name: Run go vet
        run: go vet ./...

      - name: Build and smoke-test native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${PWD}/scripthold-smoke"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          version="ci-${GITHUB_SHA::12}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/scripthold/filetoolsserver.Version=${version}" \
            -o "${binary}" \
            ./cmd/scripthold
          export MCP_EXTERNAL_SMOKE_EXECUTABLE="${binary}"
          export MCP_EXTERNAL_SMOKE_ARGS_JSON='["--transport=stdio","{TEMP_ROOT}"]'
          export MCP_EXTERNAL_SMOKE_EXPECTED_VERSION="${version}"
          export MCP_EXTERNAL_SMOKE_EXPECTED_ROOT='{TEMP_ROOT}'
          go test ./cmd/scripthold -run '^TestExternal(StdioBinarySmoke|DurableTaskLifecycle|TaskSupervisorRecovery)$' -count=1 -v

      - name: Test all server operations
        run: go run test_server.go

  analysis:
    name: Static and workflow analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Verify catalog and documentation identity
        run: go test ./internal/projectidentity ./internal/toolcatalog -count=1

      - name: Test release scripts
        run: node --test scripts/generate-server-json.test.js scripts/prepare-mcpb-assets.test.js scripts/verify-release-version.test.js

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Lint GitHub Actions workflows
        run: bash scripts/validate-workflows.sh

  fuzz:
    name: Deterministic fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run bounded fuzz smoke tests
        run: |
          go test ./internal/encoding -run '^$' -fuzz '^FuzzDetectUTF16Validation$' -fuzztime=10000x
          go test ./internal/encoding -run '^$' -fuzz '^FuzzDecoderReaderChunkInvariance$' -fuzztime=10000x
          go test ./internal/textstream -run '^$' -fuzz '^FuzzScanLinesRoundTrip$' -fuzztime=10000x
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzNormalizeHostValue$' -fuzztime=10000x
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzNormalizeOrigin$' -fuzztime=10000x
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzTrustedProxyClientAddress$' -fuzztime=10000x
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzJSONRPCMessageRoundTrip$' -fuzztime=10000x
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeDescriptor$' -fuzztime=10000x
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeManifest$' -fuzztime=10000x
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeIndex$' -fuzztime=10000x
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeListCursor$' -fuzztime=10000x
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzValidateGCPlan$' -fuzztime=10000x
          go test ./cmd/scripthold -run '^$' -fuzz '^FuzzParseBackupDiagnosticCommand$' -fuzztime=10000x

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: scripthold_linux_amd64
          - goos: linux
            goarch: arm64
            filename: scripthold_linux_arm64
          - goos: windows
            goarch: amd64
            filename: scripthold_windows_amd64.exe
          - goos: windows
            goarch: arm64
            filename: scripthold_windows_arm64.exe
          - goos: darwin
            goarch: amd64
            filename: scripthold_darwin_amd64
          - goos: darwin
            goarch: arm64
            filename: scripthold_darwin_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          OUTPUT: dist/${{ matrix.filename }}
        run: |
          mkdir -p dist
          version="ci-${GITHUB_SHA::12}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/scripthold/filetoolsserver.Version=${version}" \
            -o "${OUTPUT}" \
            ./cmd/scripthold

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build container image
        env:
          IMAGE: scripthold:ci
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}"
          docker build --build-arg VERSION="${version}" -t "${IMAGE}" .

      - name: Smoke-test container transports
        env:
          IMAGE: scripthold:ci
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}"

          uid="$(docker run --rm --entrypoint id "${IMAGE}" -u)"
          test "${uid}" = "10001"
          test "$(docker run --rm "${IMAGE}" --version)" = "${version}"

          export MCP_EXTERNAL_SMOKE_EXECUTABLE=docker
          export MCP_EXTERNAL_SMOKE_ARGS_JSON='["run","--rm","-i","--read-only","--cap-drop=ALL","--security-opt=no-new-privileges","--tmpfs","/tmp:rw,noexec,nosuid,size=64m","--mount","type=bind,source={TEMP_ROOT},target=/data","scripthold:ci","--transport=stdio","/data"]'
          export MCP_EXTERNAL_SMOKE_EXPECTED_VERSION="${version}"
          export MCP_EXTERNAL_SMOKE_EXPECTED_ROOT=/data
          go test ./cmd/scripthold -run '^TestExternalStdioBinarySmoke$' -count=1 -v

          workdir="$(mktemp -d)"
          container="scripthold-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            sudo rm -rf "${workdir}"
          }
          trap cleanup EXIT

          mkdir -p "${workdir}/data" "${workdir}/secrets"
          openssl rand -hex 32 > "${workdir}/secrets/token"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "${workdir}/secrets/key.pem" \
            -out "${workdir}/secrets/cert.pem" \
            >/dev/null 2>&1
          chmod 0755 "${workdir}"
          chmod 0600 "${workdir}/secrets/token" "${workdir}/secrets/key.pem"
          chmod 0644 "${workdir}/secrets/cert.pem"
          sudo chown -R 10001:10001 "${workdir}/data" "${workdir}/secrets"

          docker run -d --name "${container}" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=bind,source=${workdir}/data,target=/data" \
            --mount "type=bind,source=${workdir}/secrets,target=/run/secrets,readonly" \
            --publish 127.0.0.1:18765:8765 \
            --env MCP_HTTP_TOKEN_FILE=/run/secrets/token \
            --env MCP_HTTP_ADDR=0.0.0.0:8765 \
            --env MCP_HTTP_ALLOW_NON_LOOPBACK=1 \
            --env MCP_HTTP_TLS_CERT_FILE=/run/secrets/cert.pem \
            --env MCP_HTTP_TLS_KEY_FILE=/run/secrets/key.pem \
            --env MCP_HTTP_ALLOWED_HOSTS=127.0.0.1:18765 \
            "${IMAGE}" --transport=streamable-http /data

          ready=0
          for _ in $(seq 1 50); do
            if curl --silent --show-error --fail --insecure \
              https://127.0.0.1:18765/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "${ready}" != "1" ]]; then
            docker logs "${container}"
            exit 1
          fi

          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            https://127.0.0.1:18765/mcp)" = "401"
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --header 'Origin: https://attacker.example' \
            https://127.0.0.1:18765/healthz)" = "403"
          token="$(sudo cat "${workdir}/secrets/token")"
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --header "Authorization: Bearer ${token}" \
            https://127.0.0.1:18765/mcp)" = "405"
          if curl --silent --insecure --include \
            --header 'Origin: https://attacker.example' \
            https://127.0.0.1:18765/healthz 2>/dev/null \
            | grep -qi '^Access-Control-Allow-Origin:'; then
            echo 'unexpected CORS allow header' >&2
            exit 1
          fi

          docker stop --time 20 "${container}" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "${container}")" = "0"

  release-candidate:
    name: Release candidate
    needs:
      - verify-modules
      - golangci-lint
      - test
      - analysis
      - fuzz
      - cross-build
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attest exact commit gate
        run: echo "Release candidate verified for ${GITHUB_SHA}"
