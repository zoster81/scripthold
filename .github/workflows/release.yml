name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: scripthold-immutable-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false

      - name: Verify tag metadata and exact main commit
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/verify-release-version.js "${VERSION_TAG}"
          test "$(git cat-file -t "refs/tags/${VERSION_TAG}")" = 'tag'
          tag_commit="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${tag_commit}"
          echo "TAG_COMMIT=${tag_commit}" >> "${GITHUB_ENV}"

      - name: Verify successful exact-commit Test Suite gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="${TAG_COMMIT}" \
            -F per_page=100)"
          run_id="$(printf '%s' "${runs_json}" | node scripts/release-candidate-provenance.js select-run "${TAG_COMMIT}" "${GITHUB_REPOSITORY}")"
          jobs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -f filter=latest \
            -F per_page=100)"
          printf '%s' "${jobs_json}" | node scripts/release-candidate-provenance.js verify-jobs
          echo "Verified Test Suite run ${run_id} for ${TAG_COMMIT}"
          {
            echo '### Release candidate provenance'
            echo
            echo "- Commit: \`${TAG_COMMIT}\`"
            echo "- Test Suite run: \`${run_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify successful exact-commit OpenSSF Scorecard run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/scorecard.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="${TAG_COMMIT}" \
            -F per_page=100)"
          run_id="$(printf '%s' "${runs_json}" | node scripts/release-candidate-provenance.js select-scorecard-run "${TAG_COMMIT}" "${GITHUB_REPOSITORY}")"
          echo "Verified OpenSSF Scorecard run ${run_id} for ${TAG_COMMIT}"
          {
            echo "- OpenSSF Scorecard run: \`${run_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    needs: verify
    outputs:
      manifest: ${{ steps.stage.outputs.manifest }}
      ids: ${{ steps.collect.outputs.ids }}
      digests: ${{ steps.collect.outputs.digests }}
      attempt: ${{ steps.collect.outputs.attempt }}
      notes_metadata: ${{ steps.stage.outputs.notes_metadata }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare disk-backed scratch
        shell: bash
        run: |
          set -euo pipefail
          test -d "${RUNNER_TEMP}" && test -w "${RUNNER_TEMP}"
          case "$(findmnt -n -T "${RUNNER_TEMP}" -o FSTYPE)" in
            ext4|xfs|btrfs|zfs) ;;
            *) echo 'runner scratch is not on a supported disk filesystem' >&2; exit 1 ;;
          esac
          df -hPT -- "${RUNNER_TEMP}"
          printf 'TMPDIR=%s\nGOTMPDIR=%s\n' "${RUNNER_TEMP}" "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: release --clean --skip=publish,announce
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Node.js for provenance validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false

      - name: Generate signed release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Preserve original signed in-toto envelope for the private handoff
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const { parseChecksums, projectBundle } =
            require('./scripts/release-provenance');
          const filename = process.env.PROVENANCE_BUNDLE;
          const info = fs.lstatSync(filename);
          if (!info.isFile() || info.isSymbolicLink() ||
              info.nlink !== 1 || info.size <= 0 ||
              info.size > 4 * 1024 * 1024) {
            throw new Error('invalid original Sigstore bundle');
          }
          const checksums = parseChecksums(fs.readFileSync('dist/checksums.txt', 'utf8'));
          const envelope = projectBundle(
            JSON.parse(fs.readFileSync(filename, 'utf8')),
            checksums, process.env.GITHUB_REF_NAME, process.env.GITHUB_SHA);
          fs.writeFileSync(
            'scripthold-' + process.env.GITHUB_REF_NAME + '-provenance.intoto.jsonl',
            envelope, { flag: 'wx', mode: 0o600 });
          NODE

      - name: Prepare and validate private normal originals
        id: stage
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const { planOriginalGoReleaserPaths } =
            require('./scripts/release-goreleaser-original-paths');
          const { expectedReleaseAssetNames, rawStagingArtifactName } =
            require('./scripts/release-asset-contract');
          const { measureNormalSourcePayloads, encodeGoReleaserNotes } =
            require('./scripts/release-normal-source');
          const { checkNormalProvenancePair } =
            require('./scripts/release-normal-provenance-pair');

          async function main() {
            const tag = process.env.GITHUB_REF_NAME;
            const sha = process.env.GITHUB_SHA;
            const names = expectedReleaseAssetNames(tag).slice(0, 15);
            const originals = planOriginalGoReleaserPaths(tag,
              fs.readFileSync('dist/checksums.txt'),
              JSON.parse(fs.readFileSync('dist/artifacts.json', 'utf8')));
            if (names.length !== 15 || originals.length !== 13) {
              throw new Error('incomplete trusted GoReleaser source');
            }
            const sources = [
              ...originals.map(file => ({
                name: file.name, path: path.join(file.sourceParent, file.sourceLeaf),
              })),
              { name: names[13], path: process.env.PROVENANCE_BUNDLE },
              { name: names[14], path: names[14] },
            ];
            const dir = path.resolve(process.env.RUNNER_TEMP, 'private-normal-raw');
            fs.mkdirSync(dir, { mode: 0o700 });
            if (fs.readdirSync(dir).length !== 0) throw new Error('nonempty normal stage');
            const run = Number(process.env.GITHUB_RUN_ID);
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const staged = name => path.join(dir,
              rawStagingArtifactName('normal', run, attempt, name));
            for (const item of sources) {
              const initial = fs.lstatSync(item.path);
              if (!initial.isFile() || initial.isSymbolicLink() || initial.nlink !== 1) {
                throw new Error('unsafe original normal source');
              }
              const input = fs.openSync(item.path,
                fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0));
              try {
                const pinned = fs.fstatSync(input);
                if (pinned.dev !== initial.dev || pinned.ino !== initial.ino ||
                    pinned.size !== initial.size) throw new Error('source changed');
                const output = fs.openSync(staged(item.name),
                  fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL, 0o600);
                try {
                  const buffer = Buffer.allocUnsafe(65536);
                  let count;
                  while ((count = fs.readSync(input, buffer, 0, buffer.length, null)) > 0) {
                    let written = 0;
                    while (written < count) {
                      const n = fs.writeSync(output, buffer, written, count - written);
                      if (n === 0) throw new Error('normal copy made no progress');
                      written += n;
                    }
                  }
                } finally {
                  fs.closeSync(output);
                }
                const after = fs.fstatSync(input);
                const current = fs.lstatSync(item.path);
                if (after.dev !== pinned.dev || after.ino !== pinned.ino ||
                    after.size !== pinned.size || after.mtimeMs !== pinned.mtimeMs ||
                    current.dev !== pinned.dev || current.ino !== pinned.ino ||
                    !current.isFile() || current.nlink !== 1) {
                  throw new Error('source changed during staging');
                }
              } finally {
                fs.closeSync(input);
              }
            }
            if (fs.readdirSync(dir).length !== 15) throw new Error('invalid normal stage');
            const observed = names.map(name => {
              const stat = fs.lstatSync(staged(name));
              return { name, type: stat.isFile() && !stat.isSymbolicLink()
                ? 'file' : 'unsafe', nlink: stat.nlink, size: stat.size };
            });
            const manifest = await measureNormalSourcePayloads(
              tag, sha, observed, async ({ name }) =>
                fs.createReadStream(staged(name), {
                  flags: fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0),
                }));
            checkNormalProvenancePair(manifest,
              fs.readFileSync(staged('checksums.txt')),
              fs.readFileSync(staged(names[13])), fs.readFileSync(staged(names[14])));
            // GoReleaser v2.18.1 writes exact ctx.ReleaseNotes to this file.
            // It is release metadata, not a 23rd public artifact or a new changelog.
            const changelogPath = 'dist/CHANGELOG.md';
            const notesBefore = fs.lstatSync(changelogPath);
            if (!notesBefore.isFile() || notesBefore.isSymbolicLink() ||
                notesBefore.nlink !== 1 || notesBefore.size > 65536) {
              throw new Error('unsafe or oversized original GoReleaser notes');
            }
            const notesFd = fs.openSync(changelogPath,
              fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW || 0));
            let notesMetadata;
            try {
              const initial = fs.fstatSync(notesFd);
              if (initial.dev !== notesBefore.dev || initial.ino !== notesBefore.ino ||
                  initial.size !== notesBefore.size || initial.nlink !== 1) {
                throw new Error('original GoReleaser notes changed before read');
              }
              const bytes = fs.readFileSync(notesFd);
              const after = fs.fstatSync(notesFd);
              const current = fs.lstatSync(changelogPath);
              if (after.dev !== initial.dev || after.ino !== initial.ino ||
                  after.size !== initial.size || after.mtimeMs !== initial.mtimeMs ||
                  current.dev !== initial.dev || current.ino !== initial.ino ||
                  current.nlink !== 1 || bytes.length !== initial.size) {
                throw new Error('original GoReleaser notes changed during read');
              }
              notesMetadata = encodeGoReleaserNotes(bytes);
            } finally {
              fs.closeSync(notesFd);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              'manifest=' + JSON.stringify(manifest) + '\n' +
              'notes_metadata=' + JSON.stringify(notesMetadata) + '\n');
          }
          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Upload original normal 01 private bytes
        id: original01
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_darwin_amd64
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 02 private bytes
        id: original02
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_darwin_amd64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 03 private bytes
        id: original03
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_darwin_arm64
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 04 private bytes
        id: original04
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_darwin_arm64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 05 private bytes
        id: original05
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_linux_amd64
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 06 private bytes
        id: original06
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_linux_amd64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 07 private bytes
        id: original07
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_linux_arm64
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 08 private bytes
        id: original08
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_linux_arm64.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 09 private bytes
        id: original09
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_windows_amd64.exe
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 10 private bytes
        id: original10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_windows_amd64.zip
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 11 private bytes
        id: original11
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_windows_arm64.exe
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 12 private bytes
        id: original12
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold_windows_arm64.zip
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 13 private bytes
        id: original13
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-checksums.txt
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 14 private bytes
        id: original14
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold-${{ github.ref_name }}-provenance.sigstore.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Upload original normal 15 private bytes
        id: original15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/private-normal-raw/scripthold-raw-normal-${{ github.run_id }}-${{ github.run_attempt }}-scripthold-${{ github.ref_name }}-provenance.intoto.jsonl
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Bind fifteen private upload identities
        id: collect
        shell: bash
        env:
          STAGE_MANIFEST: ${{ steps.stage.outputs.manifest }}
          A1: ${{ steps.original01.outputs.artifact-id }}
          D1: ${{ steps.original01.outputs.artifact-digest }}
          A2: ${{ steps.original02.outputs.artifact-id }}
          D2: ${{ steps.original02.outputs.artifact-digest }}
          A3: ${{ steps.original03.outputs.artifact-id }}
          D3: ${{ steps.original03.outputs.artifact-digest }}
          A4: ${{ steps.original04.outputs.artifact-id }}
          D4: ${{ steps.original04.outputs.artifact-digest }}
          A5: ${{ steps.original05.outputs.artifact-id }}
          D5: ${{ steps.original05.outputs.artifact-digest }}
          A6: ${{ steps.original06.outputs.artifact-id }}
          D6: ${{ steps.original06.outputs.artifact-digest }}
          A7: ${{ steps.original07.outputs.artifact-id }}
          D7: ${{ steps.original07.outputs.artifact-digest }}
          A8: ${{ steps.original08.outputs.artifact-id }}
          D8: ${{ steps.original08.outputs.artifact-digest }}
          A9: ${{ steps.original09.outputs.artifact-id }}
          D9: ${{ steps.original09.outputs.artifact-digest }}
          A10: ${{ steps.original10.outputs.artifact-id }}
          D10: ${{ steps.original10.outputs.artifact-digest }}
          A11: ${{ steps.original11.outputs.artifact-id }}
          D11: ${{ steps.original11.outputs.artifact-digest }}
          A12: ${{ steps.original12.outputs.artifact-id }}
          D12: ${{ steps.original12.outputs.artifact-digest }}
          A13: ${{ steps.original13.outputs.artifact-id }}
          D13: ${{ steps.original13.outputs.artifact-digest }}
          A14: ${{ steps.original14.outputs.artifact-id }}
          D14: ${{ steps.original14.outputs.artifact-digest }}
          A15: ${{ steps.original15.outputs.artifact-id }}
          D15: ${{ steps.original15.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ids=()
          digests=()
          for i in $(seq 1 15); do
            idKey="A${i}"
            digestKey="D${i}"
            id="${!idKey}"
            digest="${!digestKey}"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            ids+=("$id")
            digests+=("$digest")
          done
          STAGE_IDS="$(IFS=,; echo "${ids[*]}")"
          STAGE_DIGESTS="$(IFS=,; echo "${digests[*]}")"
          export STAGE_IDS STAGE_DIGESTS
          node <<'NODE'
          'use strict';
          const { bindRawUploadJobOutputs } =
            require('./scripts/release-staging-rest');
          bindRawUploadJobOutputs({
            manifest: JSON.parse(process.env.STAGE_MANIFEST),
            repositoryId: Number(process.env.GITHUB_REPOSITORY_ID),
            runId: Number(process.env.GITHUB_RUN_ID),
            producerAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            jobOutputs: {
              ids: process.env.STAGE_IDS,
              digests: process.env.STAGE_DIGESTS,
              attempt: process.env.GITHUB_RUN_ATTEMPT,
            },
          });
          NODE
          {
            echo "ids=${STAGE_IDS}"
            echo "digests=${STAGE_DIGESTS}"
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

  publish-mcpb:
    needs: release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-mcpb-assets.yml
    with:
      version: ${{ github.ref_name }}
      normal_manifest: ${{ needs.release.outputs.manifest }}
      normal_ids: ${{ needs.release.outputs.ids }}
      normal_digests: ${{ needs.release.outputs.digests }}
      normal_attempt: ${{ needs.release.outputs.attempt }}

  verify-complete:
    needs: [release, publish-mcpb]
    # Verify the actual 22 original bytes without granting publication authority.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Require isolated disk-backed complete release staging
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          case "$(findmnt -n -T "$RUNNER_TEMP" -o FSTYPE)" in
            ext4|xfs|btrfs|zfs) ;;
            *) echo 'untrusted finalizer scratch filesystem' >&2; exit 1 ;;
          esac
          umask 077
          mkdir -m 700 -- "$RUNNER_TEMP/complete-raw"
          mkdir -m 700 -- "$RUNNER_TEMP/complete-normal"
          mkdir -m 700 -- "$RUNNER_TEMP/complete-mcpb"

      - name: Download exact twenty-two source artifact IDs without decompression
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.release.outputs.ids }},${{ needs.publish-mcpb.outputs.ids }}
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/complete-raw

      - name: Check out the authoritative tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false

      - name: Verify exact producer jobs and all twenty-two downloaded original bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NORMAL_MANIFEST: ${{ needs.release.outputs.manifest }}
          SOURCE_NORMAL_IDS: ${{ needs.release.outputs.ids }}
          SOURCE_NORMAL_DIGESTS: ${{ needs.release.outputs.digests }}
          SOURCE_NORMAL_ATTEMPT: ${{ needs.release.outputs.attempt }}
          SOURCE_RELEASE_NOTES_METADATA: ${{ needs.release.outputs.notes_metadata }}
          SOURCE_MCPB_MANIFEST: ${{ needs.publish-mcpb.outputs.manifest }}
          SOURCE_MCPB_IDS: ${{ needs.publish-mcpb.outputs.ids }}
          SOURCE_MCPB_DIGESTS: ${{ needs.publish-mcpb.outputs.digests }}
          SOURCE_MCPB_ATTEMPT: ${{ needs.publish-mcpb.outputs.attempt }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq .id)"
          export SOURCE_WORKFLOW_ID="$workflow_id"
          node scripts/release-finalizer-complete-stage.js

  finalize:
    needs: [release, publish-mcpb, verify-complete]
    # Approval is enforced by the separately configured GitHub environment.
    # A future writer must reauthenticate all 22 bytes at this new job boundary.
    environment: scripthold-immutable-publish
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Require isolated disk-backed complete release staging
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          case "$(findmnt -n -T "$RUNNER_TEMP" -o FSTYPE)" in
            ext4|xfs|btrfs|zfs) ;;
            *) echo 'untrusted finalizer scratch filesystem' >&2; exit 1 ;;
          esac
          umask 077
          mkdir -m 700 -- "$RUNNER_TEMP/complete-raw"
          mkdir -m 700 -- "$RUNNER_TEMP/complete-normal"
          mkdir -m 700 -- "$RUNNER_TEMP/complete-mcpb"

      - name: Download exact twenty-two source artifact IDs without decompression
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.release.outputs.ids }},${{ needs.publish-mcpb.outputs.ids }}
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/complete-raw

      - name: Check out the authoritative tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false

      - name: Verify exact producer jobs and all twenty-two downloaded original bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NORMAL_MANIFEST: ${{ needs.release.outputs.manifest }}
          SOURCE_NORMAL_IDS: ${{ needs.release.outputs.ids }}
          SOURCE_NORMAL_DIGESTS: ${{ needs.release.outputs.digests }}
          SOURCE_NORMAL_ATTEMPT: ${{ needs.release.outputs.attempt }}
          SOURCE_RELEASE_NOTES_METADATA: ${{ needs.release.outputs.notes_metadata }}
          SOURCE_MCPB_MANIFEST: ${{ needs.publish-mcpb.outputs.manifest }}
          SOURCE_MCPB_IDS: ${{ needs.publish-mcpb.outputs.ids }}
          SOURCE_MCPB_DIGESTS: ${{ needs.publish-mcpb.outputs.digests }}
          SOURCE_MCPB_ATTEMPT: ${{ needs.publish-mcpb.outputs.attempt }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq .id)"
          export SOURCE_WORKFLOW_ID="$workflow_id"
          node scripts/release-finalizer-complete-stage.js
      # Both installation tokens are minted only inside the approved environment,
      # after this runner has reauthenticated all twenty-two original bytes.
      # The ordinary GITHUB_TOKEN stays read-only; neither token is a writer permit.
      - name: Mint short-lived administration reader
        id: admin-reader-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SCRIPTHOLD_RELEASE_APP_ID }}
          private-key: ${{ secrets.SCRIPTHOLD_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scripthold
          permission-administration: read

      - name: Mint short-lived release writer token
        id: release-writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SCRIPTHOLD_RELEASE_APP_ID }}
          private-key: ${{ secrets.SCRIPTHOLD_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scripthold
          permission-contents: write

      # Check future writer arguments inside the approved job, but never invoke
      # a release mutator. The fail-closed step below stays unconditional.
      - name: Validate protected publication input without publishing
        shell: bash
        env:
          SOURCE_NORMAL_MANIFEST: ${{ needs.release.outputs.manifest }}
          SOURCE_MCPB_MANIFEST: ${{ needs.publish-mcpb.outputs.manifest }}
          SOURCE_RELEASE_NOTES_METADATA: ${{ needs.release.outputs.notes_metadata }}
          SCRIPTHOLD_RELEASE_ADMIN_READ_TOKEN: ${{ steps.admin-reader-token.outputs.token }}
          SCRIPTHOLD_RELEASE_WRITE_TOKEN: ${{ steps.release-writer-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const { buildProtectedPublicationInput } =
            require('./scripts/release-finalizer-write');
          const input = buildProtectedPublicationInput(process.env);
          if (input.manifest.assets.length !== 22) {
            throw new Error('incomplete protected publication input');
          }
          console.log('Protected input checked without release mutation');
          NODE

      - name: Fail closed until single-writer draft finalizer is implemented
        shell: bash
        run: |
          set -euo pipefail
          echo 'publication is disabled until the single-writer finalizer is qualified' >&2
          exit 1

  publish-registry:
    needs: finalize
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      version: ${{ github.ref_name }}
