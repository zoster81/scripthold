name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Verify tag metadata and exact main commit
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/verify-release-version.js "${VERSION_TAG}"
          test "$(git cat-file -t "refs/tags/${VERSION_TAG}")" = 'tag'
          tag_commit="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${tag_commit}"
          echo "TAG_COMMIT=${tag_commit}" >> "${GITHUB_ENV}"

      - name: Verify successful exact-commit Test Suite gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="${TAG_COMMIT}" \
            -F per_page=100)"
          run_id="$(printf '%s' "${runs_json}" | node scripts/release-candidate-provenance.js select-run "${TAG_COMMIT}" "${GITHUB_REPOSITORY}")"
          jobs_json="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -f filter=latest \
            -F per_page=100)"
          printf '%s' "${jobs_json}" | node scripts/release-candidate-provenance.js verify-jobs
          echo "Verified Test Suite run ${run_id} for ${TAG_COMMIT}"
          {
            echo '### Release candidate provenance'
            echo
            echo "- Commit: \`${TAG_COMMIT}\`"
            echo "- Test Suite run: \`${run_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcpb:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-mcpb-assets.yml
    with:
      version: ${{ github.ref_name }}

  publish-registry:
    needs: publish-mcpb
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      version: ${{ github.ref_name }}
