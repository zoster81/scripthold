name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify release tag and metadata
        run: node scripts/verify-release-version.js "${{ github.ref_name }}"

      - name: Verify dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy -diff
          go mod verify

      - name: Verify HTTP transport integration
        run: go test ./internal/httptransport ./cmd/scripthold -count=1

      - name: Run tests with race detector
        run: go test -race ./... -count=1

      - name: Run go vet
        run: go vet ./...

      - name: Verify catalog and documentation identity
        run: go test ./internal/projectidentity ./internal/toolcatalog -count=1

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run bounded fuzz smoke tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./internal/encoding -run '^$' -fuzz '^FuzzDetectUTF16Validation$' -fuzztime=5s
          go test ./internal/encoding -run '^$' -fuzz '^FuzzDecoderReaderChunkInvariance$' -fuzztime=5s
          go test ./internal/textstream -run '^$' -fuzz '^FuzzScanLinesRoundTrip$' -fuzztime=5s
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzNormalizeHostValue$' -fuzztime=5s
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzNormalizeOrigin$' -fuzztime=5s
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzTrustedProxyClientAddress$' -fuzztime=5s
          go test ./internal/httptransport -run '^$' -fuzz '^FuzzJSONRPCMessageRoundTrip$' -fuzztime=5s
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeDescriptor$' -fuzztime=5s
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeManifest$' -fuzztime=5s
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeIndex$' -fuzztime=5s
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzDecodeListCursor$' -fuzztime=5s
          go test ./internal/backupstore -run '^$' -fuzz '^FuzzValidateGCPlan$' -fuzztime=5s
          go test ./cmd/scripthold -run '^$' -fuzz '^FuzzParseBackupDiagnosticCommand$' -fuzztime=5s

      - name: Lint GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/validate-workflows.sh

      - name: Test release scripts
        run: node --test scripts/generate-server-json.test.js scripts/verify-release-version.test.js

      - name: Build and smoke-test native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="${PWD}/scripthold-smoke"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/scripthold/filetoolsserver.Version=${version}" \
            -o "${binary}" \
            ./cmd/scripthold
          export MCP_EXTERNAL_SMOKE_EXECUTABLE="${binary}"
          export MCP_EXTERNAL_SMOKE_ARGS_JSON='["--transport=stdio","{TEMP_ROOT}"]'
          export MCP_EXTERNAL_SMOKE_EXPECTED_VERSION="${version}"
          export MCP_EXTERNAL_SMOKE_EXPECTED_ROOT='{TEMP_ROOT}'
          go test ./cmd/scripthold -run '^TestExternal(StdioBinarySmoke|DurableTaskLifecycle|TaskSupervisorRecovery)$' -count=1 -v

      - name: Test all server operations
        run: go run test_server.go

  release:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-registry:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      version: ${{ github.ref_name }}
