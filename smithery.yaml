# Smithery container configuration for Scripthold's local stdio runtime.
# Tool and prompt counts are derived from the authoritative runtime catalog and are intentionally not duplicated here.

runtime: container

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - allowedDirectory
    additionalProperties: false
    properties:
      allowedDirectory:
        type: string
        minLength: 1
        description: The primary directory the server is allowed to access. Use '/data' for the default container mount point.
      additionalDirectories:
        type: array
        maxItems: 31
        uniqueItems: true
        items:
          type: string
          minLength: 1
        description: Optional additional absolute directories mounted into the container.
  commandFunction:
    |-
    (config) => {
      const args = ['--transport=stdio', config.allowedDirectory];
      if (Array.isArray(config.additionalDirectories)) {
        args.push(...config.additionalDirectories);
      }
      return { command: '/usr/local/bin/scripthold', args };
    }
  exampleConfig:
    allowedDirectory: /data
    additionalDirectories: []
